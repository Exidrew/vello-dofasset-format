[package]
name = "dofasset-renderer"
version = "0.1.0"
edition = "2024"

[lib]
name = "dofasset_renderer"
path = "src/lib.rs"

[dependencies]
vello = "0.8"
wgpu = "28"
pollster = "0.4"
image = "0.25"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
# CPU-only rasterizer (no wgpu/WebGPU dependency) — fallback path for
# devices without a working GPU adapter. Shares kurbo/peniko types with
# `vello`, so `DofAsset`/`DrawCommand` (format.rs) need no conversion.
vello_cpu = "0.1"

[[bin]]
name = "dofasset-renderer"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "windowed"
path = "src/windowed.rs"

[[bin]]
name = "svg-renderer"
path = "src/svg_renderer.rs"

[[bin]]
name = "usvg-roundtrip"
path = "src/usvg_roundtrip.rs"

[[bin]]
name = "cpu-bench"
path = "src/cpu_bench.rs"
